name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # Passwords of the throwaway CI database. The CI never uses the Anthropic key.
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ci-admin-password
      AGENT_DB_PASSWORD: ci-agent-password
      REVIEW_DB_PASSWORD: ci-review-password
      POSTGRES_PORT: "5433"
      # Without the database, the tests marked with db fail instead of being skipped.
      REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff
        run: make lint BIN=

      - name: Mypy
        run: make typecheck BIN=

      - name: Start the stack (Postgres and api)
        run: mkdir -p logs && docker compose up -d --build --wait

      - name: Pytest with coverage
        run: make test BIN=
