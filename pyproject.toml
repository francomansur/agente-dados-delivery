[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agente-dados-delivery"
version = "0.2.0"
description = "Agente que responde em português perguntas de negócio sobre uma base fictícia de delivery, gerando e executando SQL somente leitura."
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Franco Mansur Giani" }]
dependencies = [
    "anthropic>=2.8,<3",
    "fastapi>=0.163,<1",
    "langgraph>=1.2,<2",
    "mcp>=2.3,<3",
    "psycopg[binary]>=3.3,<4",
    "psycopg-pool>=3.3,<4",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "sqlglot>=30.31,<31",
    "uvicorn[standard]>=0.54,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "mypy>=2.4,<3",
    "pytest>=9.2,<10",
    "pytest-cov>=7.1,<8",
    "ruff>=0.17,<0.18",
]

[tool.setuptools.packages.find]
where = ["src"]

# The web page is not Python, so it has to be listed to go into the package (and the api image).
[tool.setuptools.package-data]
delivery_agent = ["web/*"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests", "."]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "D", "S", "SIM", "RUF", "N"]
# N818: the error names follow the spec (SQLRejected, QueryTimeout).
ignore = ["D105", "D107", "N818"]

[tool.ruff.lint.isort]
known-first-party = ["delivery_agent", "evals"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101", "S105", "S106", "S608"]
"src/delivery_agent/seed.py" = ["S311"]
# The questions and reference SQL are data: splitting them mid-sentence would hurt more than help.
"evals/cases.py" = ["E501"]
# The routes have no docstring: FastAPI would publish it in /docs, whose text is in the decorators, in Portuguese.
"src/delivery_agent/api/routes.py" = ["D103"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "evals"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = ["db: needs the Postgres of the Compose (make db-up)"]

[tool.coverage.run]
source = ["delivery_agent"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
