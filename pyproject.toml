[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agente-dados-delivery"
version = "0.2.0"
description = "Agente que responde em português perguntas de negócio sobre uma base fictícia de delivery, gerando e executando SQL somente leitura."
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Franco Mansur Giani" }]
dependencies = [
    "anthropic>=2.8,<3",
    "fastapi>=0.163,<1",
    "langgraph>=1.2,<2",
    "psycopg[binary]>=3.3,<4",
    "psycopg-pool>=3.3,<4",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "sqlglot>=30.31,<31",
    "uvicorn[standard]>=0.54,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "mypy>=2.4,<3",
    "pytest>=9.2,<10",
    "pytest-cov>=7.1,<8",
    "ruff>=0.17,<0.18",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "D", "S", "SIM", "RUF", "N"]
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101", "S105", "S106", "S608"]
"src/delivery_agent/seed.py" = ["S311"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["db: precisa do Postgres do Compose (make db-up)"]

[tool.coverage.run]
source = ["delivery_agent"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
