# docker compose up sobe o banco com os dados fictícios. A api entra na etapa 2.
services:
  postgres:
    build:
      context: .
      dockerfile: db/Dockerfile
    environment:
      POSTGRES_DB: delivery
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD:?defina AGENT_DB_PASSWORD no .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      # Pela rede (-h), para só passar depois da carga: durante a inicialização o Postgres escuta só no socket local.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d delivery"]
      interval: 2s
      timeout: 5s
      retries: 30
